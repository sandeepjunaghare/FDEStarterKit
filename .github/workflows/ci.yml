name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: api

jobs:
  check:
    name: Lint, type-check, unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0 (no major tag published)
        with:
          enable-cache: true
          cache-dependency-glob: api/uv.lock
      - name: Install
        run: uv sync --locked
      - name: Lint
        run: uv run ruff check --output-format=github . ../scripts
      - name: Format
        run: uv run ruff format --check . ../scripts
      - name: Type-check
        run: uv run pyright
      - name: Unit tests
        run: uv run pytest

  evals:
    name: Evals harness (lint, types, tests)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: evals
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0 (no major tag published)
        with:
          enable-cache: true
          cache-dependency-glob: evals/uv.lock
      - name: Install
        run: uv sync --locked
      - name: Lint
        run: uv run ruff check --output-format=github .
      - name: Format
        run: uv run ruff format --check .
      - name: Type-check
        run: uv run pyright
      - name: Tests (judge stubbed)
        run: uv run pytest
      - name: Harness self-test on the fake pipeline
        run: uv run python run.py golden/example.yaml --target fake --no-judge --no-save

  integration:
    name: Integration tests (Supabase)
    runs-on: ubuntu-latest
    needs: check
    env:
      # Empty when the repo secret isn't set, and always empty for PRs from forks.
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
    steps:
      - name: Skip without DATABASE_URL secret
        if: env.DATABASE_URL == ''
        run: echo "::notice::DATABASE_URL secret not set; skipping integration tests"
        working-directory: .
      - uses: actions/checkout@v7
        if: env.DATABASE_URL != ''
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0 (no major tag published)
        if: env.DATABASE_URL != ''
        with:
          enable-cache: true
          cache-dependency-glob: api/uv.lock
      - name: Integration tests
        if: env.DATABASE_URL != ''
        run: uv sync --locked && uv run pytest -m integration

  docker:
    name: Docker build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - name: Build api image (no push)
        uses: docker/build-push-action@v7
        with:
          context: api
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
