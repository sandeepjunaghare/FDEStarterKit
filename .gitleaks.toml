# Secret scan (CI + local): default gitleaks rules plus the gaps found when testing against our real .env.
[extend]
useDefault = true

[[rules]]
# The built-in rule only knows the sk-ant-api03- format; newer Anthropic keys use other prefixes.
id = "anthropic-api-key-any-prefix"
description = "Anthropic API key (any sk-ant- prefix)"
regex = '''\bsk-ant-[A-Za-z0-9_-]{20,}'''
keywords = ["sk-ant-"]

[[rules]]
id = "voyage-api-key"
description = "Voyage AI API key"
regex = '''\bpa-[A-Za-z0-9_-]{30,}'''
keywords = ["pa-"]

[[rules]]
id = "postgres-url-with-password"
description = "Postgres connection URL with an inline password (e.g. Supabase DATABASE_URL)"
regex = '''postgres(?:ql)?://[^:\s/@]+:[^@\s<>*]{8,}@'''
keywords = ["postgres://", "postgresql://"]

[allowlist]
description = "Documentation placeholders"
regexTarget = "match"
regexes = ['''<password>''', '''\*\*\*''', ''':s3cretPw@''']  # s3cretPw: fake URL in api/tests
